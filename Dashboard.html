<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Richelle's Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .dashboard {
            width: 350px;
            padding: 40px 30px;
            text-align: center;

            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;

            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);

            color: white;
            transition: 0.3s ease;
        }

        .dashboard:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin-bottom: 25px;
            font-size: 32px;
            letter-spacing: 2px;
        }

        .profile-pic {
            width: 150px;
            height: 150px;
            object-fit: cover;

            border-radius: 50%;
            border: 5px solid white;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);

            transition: 0.3s ease;
        }

        .profile-pic:hover {
            transform: scale(1.08);
            border-color: #ffd6ff;
        }

        h3 {
            margin-top: 25px;
            margin-bottom: 5px;
            font-size: 22px;
        }

        .role {
            margin: 0;
            color: #e0d7ff;
            font-size: 14px;
        }

        .welcome {
            margin-top: 25px;
            padding: 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.12);
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <h1>Welcome!!✨</h1>

        <img 
            src="Unknown.jpeg" 
            alt="Profile Picture" 
            class="profile-pic"
        >

        <h3>Richelle Servando</h3>

        <p class="role">My Personal Dashboard</p>

        <div class="welcome">
            💜 Glad to see you here!
        </div>

    </div>

</body>
</html>
