<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Richelle's Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at 10% 10%, #3b176b 0%, transparent 35%),
                radial-gradient(circle at 90% 90%, #25003d 0%, transparent 40%),
                linear-gradient(
                    135deg,
                    #08000f,
                    #15001f,
                    #24002f,
                    #0a0012
                );

            overflow: hidden;
            position: relative;
        }

        /* Decorative purple glow */
        body::before,
        body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
        }

        body::before {
            width: 280px;
            height: 280px;
            background: #5a189a;
            top: -100px;
            left: -100px;
            opacity: .35;
        }

        body::after {
            width: 350px;
            height: 350px;
            background: #7209b7;
            bottom: -120px;
            right: -120px;
            opacity: .3;
        }

        /* Dashboard */
        .dashboard {
            width: 350px;
            padding: 40px 30px;
            text-align: center;

            background: rgba(15, 5, 25, .78);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(190, 100, 255, .22);
            border-radius: 25px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, .65),
                0 0 30px rgba(130, 40, 200, .18),
                inset 0 1px 1px rgba(255, 255, 255, .05);

            color: white;
            position: relative;
            z-index: 1;

            transition: .3s ease;
        }

        .dashboard:hover {
            transform: translateY(-8px);

            box-shadow:
                0 30px 65px rgba(0, 0, 0, .75),
                0 0 35px rgba(157, 78, 221, .25);
        }

        /* Title */
        h1 {
            margin-bottom: 25px;
            font-size: 32px;
            letter-spacing: 2px;
            color: #ffffff;

            text-shadow:
                0 0 15px rgba(190, 100, 255, .35);
        }

        /* Profile Picture */
        .profile-pic {
            width: 150px;
            height: 150px;
            object-fit: cover;

            border-radius: 50%;
            border: 5px solid #9d4edd;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, .5),
                0 0 20px rgba(157, 78, 221, .35);

            transition: .3s ease;
        }

        .profile-pic:hover {
            transform: scale(1.08);
            border-color: #c77dff;

            box-shadow:
                0 0 30px rgba(199, 125, 255, .6);
        }

        /* Name */
        h3 {
            margin-top: 25px;
            margin-bottom: 5px;
            font-size: 22px;
            color: #ffffff;
        }

        /* Role */
        .role {
            margin: 0;
            color: #b9a9c5;
            font-size: 14px;
        }

        /* Welcome Message */
        .welcome {
            margin-top: 25px;
            padding: 12px;

            border-radius: 12px;

            background: rgba(0, 0, 0, .3);
            border: 1px solid rgba(157, 78, 221, .2);

            color: #d8cce0;
            font-size: 14px;

            box-shadow:
                inset 0 0 10px rgba(157, 78, 221, .05);
        }

        /* Purple heart */
        .welcome::first-letter {
            color: #c77dff;
        }

        /* Responsive */
        @media (max-width: 450px) {
            .dashboard {
                width: 90%;
                padding: 35px 25px;
            }

            h1 {
                font-size: 28px;
            }

            .profile-pic {
                width: 130px;
                height: 130px;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <img 
            src="Unknown.jpeg" 
            alt="Profile Picture" 
            class="profile-pic"
        >

        <h3>Richelle Servando</h3>

        <p class="role">My Personal Dashboard</p>

        <div class="welcome">
            💜 Glad to see you here!
        </div>

    </div>

</body>
</html>
